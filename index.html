<style>
:root{--bg:hsl(220,25%,95%);--card:#fff;--ink:hsl(222,30%,14%);--mute:hsl(222,14%,38%);--faint:hsl(222,10%,46%);--line:hsl(220,18%,90%);--ctl:hsl(220,10%,52%);
--pos:hsl(160,84%,28%);--neg:hsl(350,72%,44%);--flame:hsl(20,90%,36%);
--pos-bg:hsl(160,55%,86%);--pos-tx:hsl(160,80%,14%);--neg-bg:hsl(350,80%,90%);--neg-tx:hsl(350,75%,26%);--wk-bg:hsl(275,75%,90%);--wk-tx:hsl(275,65%,26%);--pl-bg:hsl(42,95%,84%);--pl-tx:hsl(32,85%,20%);--pli-bg:hsl(8,90%,87%);--pli-tx:hsl(8,75%,24%);
--t1:hsl(214,95%,87%);--t2:hsl(214,92%,70%);--t3:hsl(220,80%,48%);--t4:hsl(255,62%,50%);--t5:hsl(184,100%,25%);
--acc:#5b4bd6;--acc2:#00bcd4;--g1:rgba(108,92,231,.16);--g2:rgba(0,188,212,.12);
--s1:0 1px 3px hsla(0,0%,0%,.2);--s2:0 4px 6px hsla(0,0%,0%,.2);--s4:0 10px 24px hsla(0,0%,0%,.2);--s5:0 15px 35px hsla(0,0%,0%,.2);--r:12px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:hsl(222,28%,9%);--card:hsl(222,24%,14%);--ink:hsl(220,30%,95%);--mute:hsl(220,14%,74%);--faint:hsl(220,10%,64%);--line:hsl(222,18%,24%);--ctl:hsl(222,12%,50%);--pos:hsl(160,60%,48%);--neg:hsl(350,80%,66%);--flame:hsl(25,95%,62%);
--pos-bg:hsl(160,45%,20%);--pos-tx:hsl(160,60%,86%);--neg-bg:hsl(350,45%,24%);--neg-tx:hsl(350,80%,90%);--wk-bg:hsl(275,40%,26%);--wk-tx:hsl(275,70%,90%);--pl-bg:hsl(40,55%,22%);--pl-tx:hsl(42,90%,86%);--pli-bg:hsl(8,50%,26%);--pli-tx:hsl(8,90%,90%)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:520px;min-height:100vh;padding:16px 16px 96px;overflow-x:hidden;color:var(--ink);font:500 16px/1.5 ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;background:radial-gradient(120% 50% at 0% 0%,var(--g1),transparent 60%),radial-gradient(100% 40% at 100% 6%,var(--g2),transparent 55%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
.top h1{margin:0;font-size:30px;line-height:1.2;font-weight:700;text-transform:capitalize}
.nav{display:flex;gap:8px}
.nav button{width:48px;height:48px;border-radius:var(--r);background:var(--card);box-shadow:var(--s1);font-size:24px;line-height:1}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px;scrollbar-width:none}
.tabs::-webkit-scrollbar,#pager::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 16px;border-radius:var(--r);background:var(--card);box-shadow:var(--s1);font-size:14px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--acc);color:#fff}
.seg{display:flex;background:var(--card);border-radius:var(--r);padding:4px;margin-bottom:16px;box-shadow:var(--s1)}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
#pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;scrollbar-width:none}
.page{flex:none;width:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 16px;min-height:55vh}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;color:var(--faint);font-size:12px;font-weight:700;padding-bottom:8px}
.cell{aspect-ratio:1;border-radius:var(--r);display:flex;justify-content:center;padding-top:4px;font-size:14px;font-weight:700;background:var(--card);box-shadow:var(--s1);position:relative}
.cell.out{visibility:hidden}
.cell.today{outline:2px solid var(--ink);outline-offset:2px}
.cell small{position:absolute;bottom:4px;font-size:12px;font-weight:700;line-height:1.2}
.cell.s1{background:var(--t1);color:hsl(214,70%,22%)}.cell.s2{background:var(--t2);color:hsl(214,80%,14%)}
.cell.s3{background:var(--t3);color:#fff}.cell.s4{background:var(--t4);color:#fff}
.cell.s5{background:var(--t5);color:#fff;box-shadow:var(--s1),0 0 0 4px hsla(184,90%,45%,.4)}
.cell.part{box-shadow:var(--s1),inset 0 0 0 2px var(--t3)}
.cell.pos{background:var(--pos-bg);color:var(--pos-tx)}.cell.neg{background:var(--neg-bg);color:var(--neg-tx)}
.cell.wk{background:var(--wk-bg);color:var(--wk-tx)}.cell.pl{background:var(--pl-bg);color:var(--pl-tx)}.cell.pli{background:var(--pli-bg);color:var(--pli-tx)}
.dots{position:absolute;bottom:4px;display:flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--mute)}
.legend span{background:var(--card);border-radius:8px;padding:4px 8px;box-shadow:var(--s1)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--s1)}
.tile b{display:block;font-size:20px;line-height:1.2;font-weight:700}.tile span{font-size:12px;color:var(--mute)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--s1)}
.card h3{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--mute)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;width:100%;margin-bottom:8px;text-align:left}
.dayhead b{font-size:16px;font-weight:700}.dayhead span{color:var(--mute);font-size:14px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.task.first{border-top:0}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--ctl);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.task.done .box{background:var(--pos);border-color:var(--pos)}
.tt{font-weight:700}.task.done .tt{text-decoration:line-through;color:var(--mute);font-weight:500}
.td{font-size:14px;color:var(--mute);margin-top:4px;font-weight:500}
.badge{margin-left:auto;flex:none;font-size:14px;font-weight:700;color:var(--flame)}
.line{font-size:14px;padding:4px 0}.empty{color:var(--faint);font-size:14px;padding:4px 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:48px;padding:0 24px;border-radius:var(--r);background:var(--acc);color:#fff;font-weight:700;box-shadow:var(--s4);z-index:3}
.sheet-bg{position:fixed;inset:0;background:hsla(0,0%,0%,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px));box-shadow:var(--s5)}
.sheet::before{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--ctl);margin:0 auto 16px}
.sheet h2{margin:0 0 16px;font-size:20px;line-height:1.2;font-weight:700}
input,textarea,select{width:100%;font:inherit;padding:12px;border-radius:var(--r);border:1px solid var(--ctl);background:var(--card);color:var(--ink);margin-bottom:12px}
input[type=checkbox]{width:24px;height:24px;margin:0 8px 0 0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
label{font-size:14px;color:var(--mute);display:block;margin-bottom:4px}
label.chk{display:flex;align-items:center;color:var(--ink);margin-bottom:12px}
.row{display:flex;gap:12px}.row>*{flex:1}
.btn{background:var(--acc);color:#fff;font-weight:700;padding:12px;border-radius:var(--r);width:100%;box-shadow:var(--s1)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);margin-top:8px}
.del{color:var(--neg);font-size:14px;font-weight:700;padding:0;min-height:44px;display:flex;align-items:center}
html{touch-action:manipulation}
button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .1s}
button:active{transform:scale(.96)}
body{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.top h1{font-size:36px;line-height:1.1}
.seg button{min-height:44px}
label.chk{min-height:44px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;gap:4px;background:var(--card);box-shadow:0 -1px 0 var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;max-width:104px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r);font-size:12px;font-weight:700;line-height:1.2;color:var(--mute)}
.tabbar button.on{background:var(--acc);color:#fff}
.tabbar .ic{font-size:20px;line-height:1.2}
.fab{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-bg.open .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.sheet-bg.open .sheet{animation:none}button{transition:none}}
:root{--glass:rgba(255,255,255,.55);--glass-bar:rgba(255,255,255,.72);--edge:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){:root{--glass:rgba(34,40,58,.55);--glass-bar:rgba(22,26,40,.72);--edge:rgba(255,255,255,.1)}}
body{background:radial-gradient(120% 50% at 0% 0%,var(--g1),transparent 60%),radial-gradient(100% 40% at 100% 30%,var(--g2),transparent 55%),radial-gradient(90% 40% at 30% 100%,var(--g1),transparent 60%),var(--bg);background-attachment:fixed}
.card,.tile,.nav button,.seg,.legend span,.cell,.tabbar,.sheet{-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.card,.tile,.nav button,.seg,.legend span,.cell{background:var(--glass);box-shadow:var(--s1),inset 0 0 0 1px var(--edge)}
.tabbar{background:var(--glass-bar);box-shadow:0 -1px 0 var(--edge)}
.sheet{background:var(--glass-bar)}
.cell.s1,.cell.s2,.cell.s3,.cell.s4,.cell.s5,.cell.pos,.cell.neg,.cell.wk,.cell.pl,.cell.pli{box-shadow:var(--s1)}
.cell.s5{box-shadow:var(--s1),0 0 0 4px hsla(184,90%,45%,.4)}
.cell.part{box-shadow:var(--s1),inset 0 0 0 2px var(--t3)}
.tabbar .ic{display:block;height:24px}
.badge svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.fact{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.fact:first-child{border-top:0}.fact span{color:var(--mute)}.fact b{text-align:right;font-weight:700}
</style>
</head>
<body>
<div class="top"><h1 id="title"></h1><div class="nav"><button id="prev" aria-label="Назад">‹</button><button id="next" aria-label="Вперёд">›</button></div></div>
<div class="seg"><button id="vCal">Календарь</button><button id="vList">Список</button></div>
<div id="pager"></div>
<nav class="tabbar" id="tabs" aria-label="Календари"></nav>
<button class="fab" id="fab">+ Сегодня</button>
<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>

<script>
var KEY='seriya-v1',CUR='₽',S={tasks:[],done:{},screen:{},money:{},work:{},plans:{}},view='cal',cur=new Date(),openDay=null,openPg='all',pg=0;
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k0 in o)S[k0]=o[k0]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var PG=[['all','Общий'],['tasks','Задачи'],['money','Прибыль'],['work','Тренировки'],['plans','Планы']];
var SV=function(p){return'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'};
var IC={all:SV('<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'),tasks:SV('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'),money:SV('<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>'),work:SV('<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>'),plans:SV('<path d="M5 21V4"/><path d="M5 4h13l-2.5 4 2.5 4H5"/>')};
var FL=IC.tasks.replace('width="24" height="24"','width="16" height="16"');
var AC=[['#5b4bd6','#00bcd4','rgba(108,92,231,.3)','rgba(0,188,212,.24)'],['#2563eb','#06b6d4','rgba(59,130,246,.3)','rgba(6,182,212,.24)'],['#047857','#84cc16','rgba(16,185,129,.3)','rgba(132,204,22,.22)'],['#7e22ce','#ec4899','rgba(168,85,247,.3)','rgba(236,72,153,.24)'],['#b45309','#ef4444','rgba(245,158,11,.3)','rgba(239,68,68,.22)']];
var MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],WD=['вс','пн','вт','ср','чт','пт','сб'];
function p2(n){return n<10?'0'+n:''+n}
function fmt(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function monday(s){var d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return fmt(d)}
var TODAY=fmt(new Date());
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sh(n){var a=Math.abs(n),r=a>=1000?(a>=10000?Math.round(a/1000):Math.round(a/100)/10)+'к':''+Math.round(a);return(n<0?'−':'+')+r}
function money(n){return Math.round(n).toLocaleString('ru-RU')+' '+CUR}
function mins(m){m=+m||0;return m?Math.floor(m/60)+' ч '+(m%60)+' мин':'не указано'}
function pk(t,s){return t==='daily'?s:t==='weekly'?monday(s):s.slice(0,7)}
function isDone(t,s){return !!S.done[t.id+'|'+pk(t.type,s)]}
function back(t,s){if(t==='daily')return addDays(s,-1);if(t==='weekly')return addDays(monday(s),-7);var d=parse(s);d.setDate(1);d.setMonth(d.getMonth()-1);return fmt(d)}
function daily(s){return S.tasks.filter(function(t){return t.type==='daily'&&t.start<=s})}
function dayState(s){var l=daily(s);if(!l.length)return null;return{n:l.filter(function(t){return isDone(t,s)}).length,t:l.length}}
function streakAt(s){var c=0,k=0,st;while(k++<800){st=dayState(s);if(!st||st.n<st.t)break;c++;s=addDays(s,-1)}return c}
function taskStreak(t){var s=TODAY;if(!isDone(t,s))s=back(t.type,s);var c=0,k=0;while(k++<800&&isDone(t,s)&&pk(t.type,s)>=pk(t.type,t.start)){c++;s=back(t.type,s)}return c}
function tier(n){return n>=30?5:n>=14?4:n>=7?3:n>=3?2:n>=1?1:0}
function tasksFor(s){return S.tasks.filter(function(t){return t.start<=s||(t.type!=='daily'&&pk(t.type,t.start)<=pk(t.type,s))})}
function wmin(s){return(S.work[s]||[]).reduce(function(a,x){return a+(+x.min||0)},0)}
function net(s){var m=S.money[s];return m?(m.inc||0)-(m.exp||0):0}

function taskRow(t,s,first){var d=isDone(t,s),st=taskStreak(t);
 return '<button class="task'+(d?' done':'')+(first?' first':'')+'" data-t="'+t.id+'" data-d="'+s+'"><span class="box">'+(d?'✓':'')+'</span><span><div class="tt">'+esc(t.title)+(t.type!=='daily'?' <span class="td">· '+(t.type==='weekly'?'на неделю':'на месяц')+'</span>':'')+'</div>'+(t.desc?'<div class="td">'+esc(t.desc)+'</div>':'')+'</span>'+(st>1?'<span class="badge">'+FL+st+'</span>':'')+'</button>'}
function planRow(s,i,del){var x=S.plans[s][i];
 return '<button class="task'+(x.done?' done':'')+'" data-pt="'+i+'" data-d="'+s+'"><span class="box">'+(x.done?'✓':'')+'</span><span class="tt">'+(x.imp?'★ ':'')+esc(x.text)+'</span></button>'+(del?'<button class="del" data-pd="'+i+'" data-d="'+s+'">Удалить</button>':'')}

function cell(p,s,d){var cl='cell',sub='',st=dayState(s),m=S.money[s],w=S.work[s]||[],pl=S.plans[s]||[];
 if(p==='tasks'){if(st&&st.n===st.t){var sk=streakAt(s);cl+=' s'+tier(sk);if(sk>1)sub='<small>'+sk+'</small>'}else if(st&&st.n>0)cl+=' part'}
 else if(p==='money'){if(m){var n=net(s);cl+=n>=0?' pos':' neg';sub='<small>'+sh(n)+'</small>'}}
 else if(p==='work'){if(w.length){cl+=' wk';sub='<small>'+(wmin(s)?wmin(s)+'′':'✓')+'</small>'}}
 else if(p==='plans'){if(pl.length){cl+=pl.some(function(x){return x.imp&&!x.done})?' pli':' pl';sub='<small>'+pl.length+'</small>'}}
 else{var D=[];if(st&&st.n)D.push(st.n===st.t?'var(--t'+tier(streakAt(s))+')':'var(--mute)');if(m&&(m.inc||m.exp))D.push(net(s)>=0?'var(--pos)':'var(--neg)');if(w.length)D.push('#8b5cf6');if(pl.length)D.push('#f2a900');
  if(D.length)sub='<span class="dots">'+D.map(function(c){return'<i style="background:'+c+'"></i>'}).join('')+'</span>'}
 if(s===TODAY)cl+=' today';
 return '<button class="'+cl+'" data-day="'+s+'" data-pg="'+p+'">'+d+sub+'</button>'}

function stats(p,y,m){var n=new Date(y,m+1,0).getDate(),inc=0,exp=0,wd=0,wm=0,full=0,best=0,pt=0,pd=0,pi=0,sc=0,sn=0;
 for(var d=1;d<=n;d++){var s=y+'-'+p2(m+1)+'-'+p2(d),mo=S.money[s];if(mo){inc+=mo.inc||0;exp+=mo.exp||0}
  if((S.work[s]||[]).length){wd++;wm+=wmin(s)}
  var st=dayState(s);if(st&&st.n===st.t){full++;best=Math.max(best,streakAt(s))}
  (S.plans[s]||[]).forEach(function(x){pt++;if(x.done)pd++;else if(x.imp)pi++});
  if(S.screen[s]){sc+=S.screen[s];sn++}}
 var T=function(a,b){return'<div class="tile"><b>'+b+'</b><span>'+a+'</span></div>'},r;
 if(p==='money')r=[T('Доход',money(inc)),T('Расход',money(exp)),T('Итого за месяц',(inc-exp>=0?'+':'−')+money(Math.abs(inc-exp)))];
 else if(p==='tasks')r=[T('Дней со всеми задачами',full),T('Лучшая серия',best+' дн.')];
 else if(p==='work')r=[T('Дней с тренировками',wd),T('Всего времени',wm?mins(wm):'0')];
 else if(p==='plans')r=[T('Планов всего',pt),T('Выполнено',pd),T('Важных осталось',pi)];
 else r=[T('Прибыль',(inc-exp>=0?'+':'−')+money(Math.abs(inc-exp))),T('Тренировок (дней)',wd),T('Дней со всеми задачами',full),T('Лучшая серия',best+' дн.'),T('Планы выполнено',pd+' из '+pt),T('Экран в день',sn?mins(Math.round(sc/sn)):'—')];
 return'<div class="tiles">'+r.join('')+'</div>'}

function calHTML(p){var y=cur.getFullYear(),m=cur.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 var h='<div class="dow">'+['пн','вт','ср','чт','пт','сб','вс'].map(function(x){return'<span>'+x+'</span>'}).join('')+'</div><div class="grid">';
 for(var i=0;i<off;i++)h+='<div class="cell out"></div>';
 for(var d=1;d<=n;d++)h+=cell(p,y+'-'+p2(m+1)+'-'+p2(d),d);
 h+='</div>';
 if(p==='tasks')h+='<div class="legend"><span><i style="background:var(--t1)"></i>1–2 дня</span><span><i style="background:var(--t2)"></i>3–6</span><span><i style="background:var(--t3)"></i>7–13</span><span><i style="background:var(--t4)"></i>14–29</span><span><i style="background:var(--t5)"></i>30+</span></div>';
 if(p==='all')h+='<div class="legend"><span><i style="background:var(--t2)"></i>задачи</span><span><i style="background:var(--pos)"></i>прибыль</span><span><i style="background:var(--neg)"></i>убыток</span><span><i style="background:#8b5cf6"></i>тренировка</span><span><i style="background:#f2a900"></i>план</span></div>';
 h+=stats(p,y,m);
 if(p==='tasks'){var per=S.tasks.filter(function(t){return t.type!=='daily'});if(per.length)h+='<div class="card" style="margin-top:14px"><h3>Недельные и месячные</h3>'+per.map(function(t,i){return taskRow(t,TODAY,i===0)}).join('')+'</div>'}
 return h}

function body(p,s){var h='',m=S.money[s],w=S.work[s]||[],pl=S.plans[s]||[],all=p==='all';
 if(p==='tasks'||all){var dl=daily(s);if(all){var st=dayState(s);if(st)h+='<div class="line">Задачи: '+st.n+' из '+st.t+(streakAt(s)>1?' · '+FL+streakAt(s):'')+'</div>'}else h+=dl.length?dl.map(function(t,i){return taskRow(t,s,i===0)}).join(''):'<div class="empty">Нет задач</div>'}
 if((p==='money'||all)&&m&&(m.inc||m.exp))h+='<div class="line">Доход '+money(m.inc||0)+' · расход '+money(m.exp||0)+(m.note?' · '+esc(m.note):'')+'</div>';
 if((p==='work'||all)&&w.length)h+='<div class="line">'+w.map(function(x){return esc(x.name)+(x.min?' ('+x.min+' мин)':'')}).join(', ')+'</div>';
 if(p==='plans'||all){if(all)pl.forEach(function(x){h+='<div class="line">'+(x.done?'✓ ':'')+(x.imp?'★ ':'')+esc(x.text)+'</div>'});else pl.forEach(function(x,i){h+=planRow(s,i,false)})}
 if(all&&S.screen[s])h+='<div class="line">Экран: '+mins(S.screen[s])+'</div>';
 return h}
function listHTML(p){var y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),h='';
 for(var d=1;d<=n;d++){var s=y+'-'+p2(m+1)+'-'+p2(d);
  h+='<div class="card"><button class="dayhead" data-day="'+s+'" data-pg="'+p+'"><b>'+d+' '+WD[parse(s).getDay()]+(s===TODAY?' · сегодня':'')+'</b><span>изменить ›</span></button>'+body(p,s)+'</div>'}
 return h}

function render(){
 $('title').textContent=MONTHS[cur.getMonth()]+' '+cur.getFullYear();
 $('vCal').className=view==='cal'?'on':'';$('vList').className=view==='list'?'on':'';
 PG.forEach(function(x){$('pg-'+x[0]).innerHTML=view==='cal'?calHTML(x[0]):listHTML(x[0])});
 markTab()}
function markTab(){var a=AC[pg],r=document.documentElement.style;r.setProperty('--acc',a[0]);r.setProperty('--acc2',a[1]);r.setProperty('--g1',a[2]);r.setProperty('--g2',a[3]);$('tabs').innerHTML=PG.map(function(x,i){return'<button data-tab="'+i+'" class="'+(i===pg?'on':'')+'"><span class="ic">'+IC[x[0]]+'</span><span>'+x[1]+'</span></button>'}).join('');$('fab').textContent=PG[pg][0]==='tasks'?'+ Задача':'+ Сегодня'}
function sheet(h){$('sheet').innerHTML=h;$('bg').className='sheet-bg open'}
function closeSheet(){$('bg').className='sheet-bg';openDay=null}
function refresh(){var d=openDay,p=openPg;render();if(d)showDay(d,p)}

function secTasks(s){var l=tasksFor(s);return'<div class="card"><h3>Задачи</h3>'+(l.length?l.map(function(t,i){return taskRow(t,s,i===0)+'<button class="del" data-del="'+t.id+'">Удалить «'+esc(t.title)+'»</button>'}).join(''):'<div class="empty">Задач пока нет</div>')+'<button class="btn ghost" id="newTask">+ Новая задача</button></div>'}
function secMoney(s){var m=S.money[s]||{};return'<div class="card"><h3>Прибыль и убытки</h3><div class="row"><div><label>Доход, '+CUR+'</label><input id="mi" type="number" inputmode="decimal" value="'+(m.inc||'')+'"></div><div><label>Расход, '+CUR+'</label><input id="me" type="number" inputmode="decimal" value="'+(m.exp||'')+'"></div></div><label>Заметка</label><input id="mn" value="'+esc(m.note||'')+'"><button class="btn" id="mSave">Сохранить</button></div>'}
function secWork(s){var w=S.work[s]||[];return'<div class="card"><h3>Тренировки</h3>'+w.map(function(x,i){return'<div class="line">'+esc(x.name)+(x.min?' · '+x.min+' мин':'')+' <button class="del" style="display:inline;margin-left:8px" data-wd="'+i+'">убрать</button></div>'}).join('')+'<div class="row"><div style="flex:2"><input id="wn" placeholder="Что делали"></div><div><input id="wm" type="number" inputmode="numeric" placeholder="мин"></div></div><button class="btn" id="wAdd">Добавить</button></div>'}
function secPlans(s){var pl=S.plans[s]||[];return'<div class="card"><h3>Планы</h3>'+pl.map(function(x,i){return planRow(s,i,true)}).join('')+'<input id="pt" placeholder="Новый план" style="margin-top:8px"><label class="chk"><input type="checkbox" id="pi">Важный</label><button class="btn" id="pAdd">Добавить</button></div>'}
function secScreen(s){return'<div class="card"><h3>Время в телефоне</h3><div class="row"><input id="scr" type="number" inputmode="numeric" placeholder="минут" value="'+(S.screen[s]||'')+'"><button class="btn" id="scrSave" style="flex:none;width:auto;padding:0 16px;margin-bottom:10px">Сохранить</button></div><div class="td">Настройки → Экранное время → впишите минуты.</div></div>'}
function secFacts(s){var m=S.money[s]||{},w=S.work[s]||[],pl=S.plans[s]||[],st=dayState(s),h='',R=function(a,b){return'<div class="fact"><span>'+a+'</span><b>'+b+'</b></div>'};
 h+=R('Задачи',st?st.n+' из '+st.t+(streakAt(s)>1?' · '+FL+streakAt(s):''):'нет задач');
 h+=R('Прибыль',(m.inc||m.exp)?(net(s)>=0?'+':'−')+money(Math.abs(net(s)))+'<div class="td">доход '+money(m.inc||0)+' · расход '+money(m.exp||0)+(m.note?' · '+esc(m.note):'')+'</div>':'нет записей');
 h+=R('Тренировки',w.length?w.map(function(x){return esc(x.name)+(x.min?' · '+x.min+' мин':'')}).join('<br>'):'нет');
 h+=R('Планы',pl.length?pl.map(function(x){return(x.done?'✓ ':'')+(x.imp?'★ ':'')+esc(x.text)}).join('<br>'):'нет');
 h+=R('Экран',S.screen[s]?mins(S.screen[s]):'не указано');
 return'<div class="card">'+h+'</div><div class="td" style="margin-bottom:16px">Менять данные можно в нужном календаре.</div>'}
function showDay(s,p){openDay=s;openPg=p;var d=parse(s),h='<h2>'+d.getDate()+' '+MONTHS[d.getMonth()]+', '+WD[d.getDay()]+'</h2>';
 if(p==='all')h+=secFacts(s);
 else h+={tasks:secTasks,money:secMoney,work:secWork,plans:secPlans}[p](s);
 sheet(h+'<button class="btn ghost" id="close">Закрыть</button>')}
function showAdd(){sheet('<h2>Новая задача</h2><label>Название</label><input id="nt" placeholder="Например: отжимания 10 раз"><label>Описание</label><textarea id="nd" rows="2" placeholder="Необязательно"></textarea><div class="row"><div><label>Как часто</label><select id="ntype"><option value="daily">Каждый день</option><option value="weekly">Раз в неделю</option><option value="monthly">Раз в месяц</option></select></div><div><label>Начать с</label><input id="ns" type="date" value="'+TODAY+'"></div></div><button class="btn" id="add">Добавить</button><button class="btn ghost" id="close">Отмена</button>')}

document.addEventListener('click',function(e){
 if(e.target===$('bg')){closeSheet();return}
 var b=e.target.closest('button');if(!b)return;var id=b.id,D=b.dataset;
 if(id==='prev'||id==='next'){cur.setMonth(cur.getMonth()+(id==='next'?1:-1),1);render()}
 else if(id==='vCal'){view='cal';render()}else if(id==='vList'){view='list';render()}
 else if(D.tab!==undefined){var pgr=$('pager');pgr.scrollTo({left:+D.tab*pgr.clientWidth,behavior:'smooth'})}
 else if(id==='fab'){if(PG[pg][0]==='tasks')showAdd();else showDay(TODAY,PG[pg][0])}
 else if(id==='close')closeSheet();
 else if(id==='newTask')showAdd();
 else if(id==='add'){var t=$('nt').value.trim();if(!t){$('nt').focus();return}S.tasks.push({id:'t'+Date.now(),title:t,desc:$('nd').value.trim(),type:$('ntype').value,start:$('ns').value||TODAY});save();closeSheet();render()}
 else if(id==='scrSave'){S.screen[openDay]=+$('scr').value||0;save();render();closeSheet()}
 else if(id==='mSave'){var i=+$('mi').value||0,x=+$('me').value||0,nt=$('mn').value.trim();if(i||x||nt)S.money[openDay]={inc:i,exp:x,note:nt};else delete S.money[openDay];save();render();closeSheet()}
 else if(id==='wAdd'){var n=$('wn').value.trim();if(!n){$('wn').focus();return}(S.work[openDay]=S.work[openDay]||[]).push({name:n,min:+$('wm').value||0});save();render();closeSheet()}
 else if(D.wd!==undefined){S.work[openDay].splice(+D.wd,1);if(!S.work[openDay].length)delete S.work[openDay];save();refresh()}
 else if(id==='pAdd'){var tx=$('pt').value.trim();if(!tx){$('pt').focus();return}(S.plans[openDay]=S.plans[openDay]||[]).push({text:tx,imp:$('pi').checked,done:false});save();render();closeSheet()}
 else if(D.pt!==undefined){var pp=S.plans[D.d][+D.pt];pp.done=!pp.done;save();refresh()}
 else if(D.pd!==undefined){S.plans[D.d].splice(+D.pd,1);if(!S.plans[D.d].length)delete S.plans[D.d];save();refresh()}
 else if(D.day){showDay(D.day,D.pg)}
 else if(D.del){if(confirm('Удалить задачу и её историю?')){var tid=D.del;S.tasks=S.tasks.filter(function(t){return t.id!==tid});for(var k in S.done)if(k.indexOf(tid+'|')===0)delete S.done[k];save();refresh()}}
 else if(D.t){var t2=S.tasks.filter(function(x){return x.id===D.t})[0],kk=t2.id+'|'+pk(t2.type,D.d);if(S.done[kk])delete S.done[kk];else S.done[kk]=1;save();refresh()}
});
var pgr=$('pager');
PG.forEach(function(x){var s=document.createElement('section');s.className='page';s.id='pg-'+x[0];pgr.appendChild(s)});
var tm;pgr.addEventListener('scroll',function(){clearTimeout(tm);tm=setTimeout(function(){var i=Math.round(pgr.scrollLeft/pgr.clientWidth);if(i!==pg){pg=i;markTab()}},60)});
(function(){var sh=$('sheet'),y0=0,dy=0,drag=false;
sh.addEventListener('touchstart',function(e){if(sh.scrollTop>0||e.touches[0].clientY-sh.getBoundingClientRect().top>56){drag=false;return}y0=e.touches[0].clientY;dy=0;drag=true;sh.style.transition='none'},{passive:true});
sh.addEventListener('touchmove',function(e){if(!drag)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform='translateY('+dy+'px)'},{passive:true});
sh.addEventListener('touchend',function(){if(!drag)return;drag=false;sh.style.transition='transform .2s';if(dy>100){sh.style.transform='translateY(100%)';setTimeout(function(){closeSheet();sh.style.transform='';sh.style.transition=''},180)}else{sh.style.transform=''}});
})();
render();
</script>
</body>
</html>
