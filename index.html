<style>
:root{--bg:hsl(220,25%,95%);--card:#fff;--ink:hsl(222,30%,14%);--mute:hsl(222,14%,38%);--faint:hsl(222,10%,46%);--line:hsl(220,18%,90%);--ctl:hsl(220,10%,52%);
--pos:hsl(160,84%,28%);--neg:hsl(350,72%,44%);--flame:hsl(20,90%,36%);
--pos-bg:hsl(160,55%,86%);--pos-tx:hsl(160,80%,14%);--neg-bg:hsl(350,80%,90%);--neg-tx:hsl(350,75%,26%);--wk-bg:hsl(275,75%,90%);--wk-tx:hsl(275,65%,26%);--pl-bg:hsl(42,95%,84%);--pl-tx:hsl(32,85%,20%);--pli-bg:hsl(8,90%,87%);--pli-tx:hsl(8,75%,24%);
--t1:hsl(214,95%,87%);--t2:hsl(214,92%,70%);--t3:hsl(220,80%,48%);--t4:hsl(255,62%,50%);--t5:hsl(184,100%,25%);
--acc:#5b4bd6;--acc2:#00bcd4;--g1:rgba(108,92,231,.16);--g2:rgba(0,188,212,.12);
--s1:0 1px 3px hsla(0,0%,0%,.2);--s2:0 4px 6px hsla(0,0%,0%,.2);--s4:0 10px 24px hsla(0,0%,0%,.2);--s5:0 15px 35px hsla(0,0%,0%,.2);--r:12px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:hsl(222,28%,9%);--card:hsl(222,24%,14%);--ink:hsl(220,30%,95%);--mute:hsl(220,14%,74%);--faint:hsl(220,10%,64%);--line:hsl(222,18%,24%);--ctl:hsl(222,12%,50%);--pos:hsl(160,60%,48%);--neg:hsl(350,80%,66%);--flame:hsl(25,95%,62%);
--pos-bg:hsl(160,45%,20%);--pos-tx:hsl(160,60%,86%);--neg-bg:hsl(350,45%,24%);--neg-tx:hsl(350,80%,90%);--wk-bg:hsl(275,40%,26%);--wk-tx:hsl(275,70%,90%);--pl-bg:hsl(40,55%,22%);--pl-tx:hsl(42,90%,86%);--pli-bg:hsl(8,50%,26%);--pli-tx:hsl(8,90%,90%)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:hsl(222,28%,9%);--card:hsl(222,24%,14%);--ink:hsl(220,30%,95%);--mute:hsl(220,14%,74%);--faint:hsl(220,10%,64%);--line:hsl(222,18%,24%);--ctl:hsl(222,12%,50%);--pos:hsl(160,60%,48%);--neg:hsl(350,80%,66%);--flame:hsl(25,95%,62%);
--pos-bg:hsl(160,45%,20%);--pos-tx:hsl(160,60%,86%);--neg-bg:hsl(350,45%,24%);--neg-tx:hsl(350,80%,90%);--wk-bg:hsl(275,40%,26%);--wk-tx:hsl(275,70%,90%);--pl-bg:hsl(40,55%,22%);--pl-tx:hsl(42,90%,86%);--pli-bg:hsl(8,50%,26%);--pli-tx:hsl(8,90%,90%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0 auto;max-width:520px;min-height:100vh;padding:16px 16px 96px;overflow-x:hidden;color:var(--ink);font:500 16px/1.5 ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;background:radial-gradient(120% 50% at 0% 0%,var(--g1),transparent 60%),radial-gradient(100% 40% at 100% 6%,var(--g2),transparent 55%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}
.top h1{margin:0;font-size:30px;line-height:1.2;font-weight:700;text-transform:capitalize}
.nav{display:flex;gap:8px}
.nav button{width:48px;height:48px;border-radius:var(--r);background:var(--card);box-shadow:var(--s1);font-size:24px;line-height:1}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px;scrollbar-width:none}
.tabs::-webkit-scrollbar,#pager::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 16px;border-radius:var(--r);background:var(--card);box-shadow:var(--s1);font-size:14px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--acc);color:#fff}
.seg{display:flex;background:var(--card);border-radius:var(--r);padding:4px;margin-bottom:16px;box-shadow:var(--s1)}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:14px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
#pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;scrollbar-width:none}
.page{flex:none;width:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 16px;min-height:55vh}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;color:var(--faint);font-size:12px;font-weight:700;padding-bottom:8px}
.cell{aspect-ratio:1;border-radius:var(--r);display:flex;justify-content:center;padding-top:4px;font-size:14px;font-weight:700;background:var(--card);box-shadow:var(--s1);position:relative}
.cell.out{visibility:hidden}
.cell.today{outline:2px solid var(--ink);outline-offset:2px}
.cell small{position:absolute;bottom:4px;font-size:12px;font-weight:700;line-height:1.2}
.cell.s1{background:var(--t1);color:hsl(214,70%,22%)}.cell.s2{background:var(--t2);color:hsl(214,80%,14%)}
.cell.s3{background:var(--t3);color:#fff}.cell.s4{background:var(--t4);color:#fff}
.cell.s5{background:var(--t5);color:#fff;box-shadow:var(--s1),0 0 0 4px hsla(184,90%,45%,.4)}
.cell.part{box-shadow:var(--s1),inset 0 0 0 2px var(--t3)}
.cell.pos{background:var(--pos-bg);color:var(--pos-tx)}.cell.neg{background:var(--neg-bg);color:var(--neg-tx)}
.cell.wk{background:var(--wk-bg);color:var(--wk-tx)}.cell.pl{background:var(--pl-bg);color:var(--pl-tx)}.cell.pli{background:var(--pli-bg);color:var(--pli-tx)}
.dots{position:absolute;bottom:4px;display:flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--mute)}
.legend span{background:var(--card);border-radius:8px;padding:4px 8px;box-shadow:var(--s1)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--s1)}
.tile b{display:block;font-size:20px;line-height:1.2;font-weight:700}.tile span{font-size:12px;color:var(--mute)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--s1)}
.card h3{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--mute)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;width:100%;margin-bottom:8px;text-align:left}
.dayhead b{font-size:16px;font-weight:700}.dayhead span{color:var(--mute);font-size:14px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.task.first{border-top:0}
.box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--ctl);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.task.done .box{background:var(--pos);border-color:var(--pos)}
.tt{font-weight:700}.task.done .tt{text-decoration:line-through;color:var(--mute);font-weight:500}
.td{font-size:14px;color:var(--mute);margin-top:4px;font-weight:500}
.badge{margin-left:auto;flex:none;font-size:14px;font-weight:700;color:var(--flame)}
.line{font-size:14px;padding:4px 0}.empty{color:var(--faint);font-size:14px;padding:4px 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:48px;padding:0 24px;border-radius:var(--r);background:var(--acc);color:#fff;font-weight:700;box-shadow:var(--s4);z-index:3}
.sheet-bg{position:fixed;inset:0;background:hsla(0,0%,0%,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px));box-shadow:var(--s5)}
.sheet::before{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--ctl);margin:0 auto 16px}
.sheet h2{margin:0 0 16px;font-size:20px;line-height:1.2;font-weight:700}
input,textarea,select{width:100%;font:inherit;padding:12px;border-radius:var(--r);border:1px solid var(--ctl);background:var(--card);color:var(--ink);margin-bottom:12px}

<body>
<div class="top"><h1 id="title"></h1><div class="nav"><button id="prev" aria-label="Назад"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button id="tmr" aria-label="Таймеры"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><i id="tbadge"></i></button><button id="thm" aria-label="Тема"></button></div></div>

<script>
var KEY='seriya-v1',CUR='₽',S={tasks:[],done:{},screen:{},money:{},work:{},plans:{}},view='cal',cur=new Date(),openDay=null,openPg='all',pg=0;
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k0 in o)S[k0]=o[k0]}}catch(e){}
S.timers=S.timers||[];S.series=S.series||[];S.sw=S.sw||{run:false,start:0,acc:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var PG=[['all','Общий'],['tasks','Задачи'],['money','Прибыль'],['work','Тренировки'],['plans','Планы']];
var SV=function(p){return'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'};
var IC={all:SV('<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'),tasks:SV('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'),money:SV('<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>'),work:SV('<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>'),plans:SV('<path d="M5 21V4"/><path d="M5 4h13l-2.5 4 2.5 4H5"/>')};
var CK=SV('<path d="M5 12l5 5L20 7"/>').replace('width="24" height="24"','width="16" height="16"').replace('stroke-width="2"','stroke-width="3"');
var FL=IC.tasks.replace('width="24" height="24"','width="16" height="16"');
var AC=[['#5b4bd6','#00bcd4','rgba(108,92,231,.3)','rgba(0,188,212,.24)'],['#2563eb','#06b6d4','rgba(59,130,246,.3)','rgba(6,182,212,.24)'],['#047857','#84cc16','rgba(16,185,129,.3)','rgba(132,204,22,.22)'],['#7e22ce','#ec4899','rgba(168,85,247,.3)','rgba(236,72,153,.24)'],['#b45309','#ef4444','rgba(245,158,11,.3)','rgba(239,68,68,.22)']];
var MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],WD=['вс','пн','вт','ср','чт','пт','сб'];
function p2(n){return n<10?'0'+n:''+n}
function fmt(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function monday(s){var d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return fmt(d)}
var TODAY=fmt(new Date());
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sh(n){var a=Math.abs(n),r=a>=1000?(a>=10000?Math.round(a/1000):Math.round(a/100)/10)+'к':''+Math.round(a);return(n<0?'−':'+')+r}
function money(n){return Math.round(n).toLocaleString('ru-RU')+' '+CUR}
function mins(m){m=+m||0;return m?(m<60?m+' мин':Math.floor(m/60)+' ч '+(m%60)+' мин'):'не указано'}
function rz(n){var a=n%10,b=n%100;return n+' '+(a>=2&&a<=4&&(b<12||b>14)?'раза':'раз')}
function pk(t,s){return t==='daily'?s:t==='weekly'?monday(s):s.slice(0,7)}
function isDone(t,s){return !!S.done[t.id+'|'+pk(t.type,s)]}
function back(t,s){if(t==='daily')return addDays(s,-1);if(t==='weekly')return addDays(monday(s),-7);var d=parse(s);d.setDate(1);d.setMonth(d.getMonth()-1);return fmt(d)}
function daily(s){return S.tasks.filter(function(t){return t.type==='daily'&&t.start<=s})}
function dayState(s){var l=daily(s);if(!l.length)return null;return{n:l.filter(function(t){return isDone(t,s)}).length,t:l.length}}
function streakAt(s){var c=0,k=0,st;while(k++<800){st=dayState(s);if(!st||st.n<st.t)break;c++;s=addDays(s,-1)}return c}
function taskStreak(t){var s=TODAY;if(!isDone(t,s))s=back(t.type,s);var c=0,k=0;while(k++<800&&isDone(t,s)&&pk(t.type,s)>=pk(t.type,t.start)){c++;s=back(t.type,s)}return c}
function tier(n){return n>=30?5:n>=14?4:n>=7?3:n>=3?2:n>=1?1:0}
function tasksFor(s){return S.tasks.filter(function(t){return t.start<=s||(t.type!=='daily'&&pk(t.type,t.start)<=pk(t.type,s))})}
function wmin(s){return(S.work[s]||[]).reduce(function(a,x){return a+(+x.min||0)},0)}
function net(s){var m=S.money[s];return m?(m.inc||0)-(m.exp||0):0}

function taskRow(t,s,first){var d=isDone(t,s),st=taskStreak(t);
 return '<button class="task'+(d?' done':'')+(first?' first':'')+'" data-t="'+t.id+'" data-d="'+s+'" role="checkbox" aria-checked="'+d+'"><span class="box">'+(d?CK:'')+'</span><span><div class="tt">'+esc(t.title)+(t.type!=='daily'?' <span class="td">· '+(t.type==='weekly'?'на неделю':'на месяц')+'</span>':'')+'</div>'+(t.desc?'<div class="td">'+esc(t.desc)+'</div>':'')+'</span>'+(st>1?'<span class="badge">'+FL+st+'</span>':'')+'</button>'}
function planRow(s,i,del){var x=S.plans[s][i];
 return '<button class="task'+(x.done?' done':'')+'" data-pt="'+i+'" data-d="'+s+'" role="checkbox" aria-checked="'+!!x.done+'"><span class="box">'+(x.done?CK:'')+'</span><span><span class="tt">'+(x.imp?'<span class="star">★</span> ':'')+esc(x.text)+(x.miss>1?' ×'+x.miss:'')+'</span>'+(x.from?'<div class="td">перенесено с '+x.from.slice(8)+'.'+x.from.slice(5,7)+'</div>':'')+'</span></button>'+(del?'<button class="del" data-pd="'+i+'" data-d="'+s+'">Удалить</button>':'')}

function cell(p,s,d){var cl='cell',sub='',st=dayState(s),m=S.money[s],w=S.work[s]||[],pl=S.plans[s]||[];
 if(p==='tasks'){if(st&&st.n===st.t){var sk=streakAt(s);cl+=' s'+tier(sk);if(sk>1)sub='<small>'+sk+'</small>'}else if(st&&st.n>0)cl+=' part'}
 else if(p==='money'){if(m){var n=net(s);cl+=n>=0?' pos':' neg';sub='<small>'+sh(n)+'</small>'}}
 else if(p==='work'){if(w.length){cl+=' wk';sub='<small>'+(wmin(s)?wmin(s)+'′':'✓')+'</small>'}}
 else if(p==='plans'){if(pl.length){cl+=pl.some(function(x){return x.imp&&!x.done})?' pli':' pl';sub='<small>'+pl.length+'</small>'}}
 else{var D=[];if(st&&st.n)D.push(st.n===st.t?'var(--t'+tier(streakAt(s))+')':'var(--mute)');if(m&&(m.inc||m.exp))D.push(net(s)>=0?'var(--pos)':'var(--neg)');if(w.length)D.push('#8b5cf6');if(pl.length)D.push('#f2a900');if(tmOn(s).length)D.push('#06b6d4');
  if(D.length)sub='<span class="dots">'+D.map(function(c){return'<i style="background:'+c+'"></i>'}).join('')+'</span>'}
 if(s===TODAY)cl+=' today';
 return '<button class="'+cl+'" data-day="'+s+'" data-pg="'+p+'" aria-label="'+d+' '+MONTHS[+s.slice(5,7)-1]+'">'+d+sub+'</button>'}

function stats(p,y,m){var n=new Date(y,m+1,0).getDate(),inc=0,exp=0,wd=0,wm=0,full=0,best=0,pt=0,pd=0,pi=0,sc=0,sn=0;
 for(var d=1;d<=n;d++){var s=y+'-'+p2(m+1)+'-'+p2(d),mo=S.money[s];if(mo){inc+=mo.inc||0;exp+=mo.exp||0}
  if((S.work[s]||[]).length){wd++;wm+=wmin(s)}
  var st=dayState(s);if(st&&st.n===st.t){full++;best=Math.max(best,streakAt(s))}
  (S.plans[s]||[]).forEach(function(x){pt++;if(x.done)pd++;else if(x.imp)pi++});
  if(S.screen[s]){sc+=S.screen[s];sn++}}
 var T=function(a,b){return'<div class="tile"><b>'+b+'</b><span>'+a+'</span></div>'},r;
 if(p==='money')r=[T('Доход',money(inc)),T('Расход',money(exp)),T('Итого за месяц',(inc-exp>=0?'+':'−')+money(Math.abs(inc-exp)))];
 else if(p==='tasks')r=[T('Дней со всеми задачами',full),T('Лучшая серия',best+' дн.')];
 else if(p==='work')r=[T('Дней с тренировками',wd),T('Всего времени',wm?mins(wm):'0')];
 else if(p==='plans')r=[T('Планов всего',pt),T('Выполнено',pd),T('Важных осталось',pi)];
 else r=[T('Прибыль',(inc-exp>=0?'+':'−')+money(Math.abs(inc-exp))),T('Тренировок (дней)',wd),T('Дней со всеми задачами',full),T('Лучшая серия',best+' дн.'),T('Планы выполнено',pd+' из '+pt),T('Экран в день',sn?mins(Math.round(sc/sn)):'—')];
 return'<div class="tiles">'+r.join('')+'</div>'}

function calHTML(p){var y=cur.getFullYear(),m=cur.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
 var h=(p==='all'?heroHTML():'')+'<div class="dow">'+['пн','вт','ср','чт','пт','сб','вс'].map(function(x){return'<span>'+x+'</span>'}).join('')+'</div><div class="grid">';
 for(var i=0;i<off;i++)h+='<div class="cell out"></div>';
 for(var d=1;d<=n;d++)h+=cell(p,y+'-'+p2(m+1)+'-'+p2(d),d);
 h+='</div>';
 if(p==='tasks')h+='<div class="legend"><span><i style="background:var(--t1)"></i>1–2 дня</span><span><i style="background:var(--t2)"></i>3–6</span><span><i style="background:var(--t3)"></i>7–13</span><span><i style="background:var(--t4)"></i>14–29</span><span><i style="background:var(--t5)"></i>30+</span></div>';
 if(p==='all')h+='<div class="legend"><span><i style="background:var(--t2)"></i>задачи</span><span><i style="background:var(--pos)"></i>прибыль</span><span><i style="background:var(--neg)"></i>убыток</span><span><i style="background:#8b5cf6"></i>тренировка</span><span><i style="background:#f2a900"></i>план</span><span><i style="background:#06b6d4"></i>таймер</span></div>';
 h+=stats(p,y,m);if(p==='all')h+='<div style="margin-top:24px">'+sumHTML()+monthHTML(y,m)+badgeCard()+dataCard()+'</div>';if(p==='plans')h+=planBox();
 if(p==='tasks'){var per=S.tasks.filter(function(t){return t.type!=='daily'});if(per.length)h+='<div class="card" style="margin-top:14px"><h3>Недельные и месячные</h3>'+per.map(function(t,i){return taskRow(t,TODAY,i===0)}).join('')+'</div>'}

var BD=[['Серия 3 дня','best',3],['Серия 7 дней','best',7],['Серия 14 дней','best',14],['Серия 30 дней','best',30],['10 планов','pd',10],['50 планов','pd',50],['Первая тренировка','wk',1],['10 тренировок','wk',10],['50 тренировок','wk',50],['5 дел на время','tm',5]];
function lifetime(){var first=null,run=0,best=0,pd=0,wk=0,k=0;S.tasks.forEach(function(t){if(!first||t.start<first)first=t.start});
 if(first)for(var d=first;d<=TODAY&&k++<2000;d=addDays(d,1)){var st=dayState(d);if(st&&st.n===st.t){run++;if(run>best)best=run}else if(d<TODAY)run=0}
 Object.keys(S.plans).forEach(function(x){S.plans[x].forEach(function(y){if(y.done)pd++})});Object.keys(S.work).forEach(function(x){wk+=S.work[x].length});
 return{best:best,pd:pd,wk:wk,tm:S.timers.filter(function(t){return t.res==='ok'}).length}}
function badgeCard(){var L=lifetime(),STAR=SV('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>');
 return'<div class="card"><h3>Награды</h3><div class="bds">'+BD.map(function(b){var v=L[b[1]],ok=v>=b[2];return'<div class="bd'+(ok?' on':'')+'">'+STAR+'<span><b>'+b[0]+'</b><i>'+(ok?'получено':Math.min(v,b[2])+' из '+b[2])+'</i></span></div>'}).join('')+'</div></div>'}
function checkBadges(){var L=lifetime(),n=[];S.bd=S.bd||{};BD.forEach(function(b,i){if(L[b[1]]>=b[2]&&!S.bd[i]){S.bd[i]=1;n.push(b[0])}});if(n.length){save();toast('Новая награда: '+n[0],1)}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
$('sheet').setAttribute('role','dialog');$('sheet').setAttribute('aria-modal','true');
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
if(!S.bd){S.bd={};var L0=lifetime();BD.forEach(function(b,i){if(L0[b[1]]>=b[2])S.bd[i]=1})}
applyTheme();roll();S.series.forEach(fill);save();

(function(){var sh=$('sheet'),y0=0,dy=0,drag=false;
sh.addEventListener('touchstart',function(e){if(sh.scrollTop>0||e.touches[0].clientY-sh.getBoundingClientRect().top>56){drag=false;return}y0=e.touches[0].clientY;dy=0;drag=true;sh.style.transition='none'},{passive:true});
sh.addEventListener('touchmove',function(e){if(!drag)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform='translateY('+dy+'px)'},{passive:true});
sh.addEventListener('touchend',function(){if(!drag)return;drag=false;sh.style.transition='transform .2s';if(dy>100){sh.style.transform='translateY(100%)';setTimeout(function(){closeSheet();sh.style.transform='';sh.style.transition=''},180)}else{sh.style.transform=''}});
})();
render();showSummary();
</script>
