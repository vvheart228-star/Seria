/* Center the workspace, page headings, controls, empty states, metrics and modal content. */
.app{max-width:1760px;margin-inline:auto}
.main{max-width:1320px;margin-inline:auto}
#content{width:100%;max-width:1220px;margin-inline:auto}
.top-copy{margin:0 auto 27px;text-align:center;max-width:820px}
.top-copy p{margin-inline:auto;max-width:720px}
.header{gap:16px}
.toolbar{justify-content:center;gap:13px;margin-bottom:22px}
.toolbar > .chip-row{justify-content:center;flex-wrap:wrap}
.section-head h2{line-height:1.35}
.kpi-card{text-align:center;align-items:center;justify-content:center;gap:11px}
.kpi-top{width:100%;justify-content:center;position:relative;padding-right:0;min-height:28px}
.kpi-icon{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.kpi-top>span:first-child{max-width:calc(100% - 40px);margin-inline:auto}
.kpi-card .big-num{overflow-wrap:anywhere}
.settings-list{margin-inline:auto;width:100%;max-width:900px}
.calendar-wrap{max-width:1220px;margin-inline:auto}
.hero{background:linear-gradient(112deg,var(--heroA),var(--heroB) 64%,var(--heroC));border-color:var(--heroBorder);color:var(--heroText)}
.hero .eyebrow{color:var(--heroMuted)}.hero p,.hero-progress .inside span{color:var(--heroMuted)}
.hero .btn{background:var(--heroAction);color:var(--heroActionText)}
.hero .btn-outline{background:rgba(255,255,255,.10);color:var(--heroText);border:1px solid rgba(255,255,255,.23)}
.brand-symbol{background:linear-gradient(140deg,var(--accent),var(--blue));color:var(--accentInk);box-shadow:0 10px 22px var(--accentSoft)}
.week-fill{background:linear-gradient(var(--accent),var(--blue))}
.heat-cell.l1{background:color-mix(in srgb,var(--accent) 24%,var(--surface3))}.heat-cell.l2{background:color-mix(in srgb,var(--accent) 44%,var(--surface3))}.heat-cell.l3{background:color-mix(in srgb,var(--accent) 70%,var(--surface3))}.heat-cell.l4{background:var(--accent)}
/* The actual preview palette and selection are keyboard accessible. */
.theme-panel{border-top:1px solid var(--line);padding-top:18px;margin-top:14px}
.theme-panel-head{text-align:center;margin-bottom:17px}.theme-panel-head strong{font-size:14px;display:block}.theme-panel-head p{font-size:12px;color:var(--muted);margin:5px 0 0}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.theme-choice{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);background:var(--surface2);border-radius:15px;padding:10px;min-height:67px;text-align:left;min-width:0;transition:transform .12s,border-color .15s,background .15s}
.theme-choice:hover{border-color:var(--accent)}.theme-choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accentSoft)}
.theme-swatch{height:43px;width:48px;min-width:48px;border-radius:11px;border:1px solid rgba(128,128,128,.25);position:relative;overflow:hidden}
.theme-swatch:after{content:"";position:absolute;bottom:6px;left:6px;width:18px;height:6px;border-radius:10px;background:rgba(255,255,255,.55)}
.theme-labels{display:grid;gap:2px;min-width:0}.theme-labels strong{font-size:12px;line-height:1.2;overflow-wrap:anywhere}.theme-labels small{font-size:10px;color:var(--muted);line-height:1.2}
.theme-check{margin-left:auto;color:var(--accent);font-size:18px;line-height:1}
/* Finance calendar uses actual dated transactions, never estimates. */
.finance-switch{display:inline-flex;gap:4px;background:var(--surface);padding:5px;border:1px solid var(--line);border-radius:15px;max-width:100%}
.finance-switch button{display:flex;gap:7px;align-items:center;justify-content:center;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:770;padding:10px 16px;min-width:125px}
.finance-switch button svg{width:17px;height:17px}.finance-switch button.active{background:var(--accentSoft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.finance-view-header{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:17px}
.finance-view-header .section-head{margin:0}
.finance-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,.88fr);gap:17px;align-items:start}
.finance-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;width:100%}
.finance-weekday{font-size:11px;font-weight:800;text-align:center;color:var(--muted);padding:9px 0}
.finance-day{position:relative;min-width:0;min-height:102px;border:1px solid var(--line);border-radius:13px;padding:9px 8px;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:4px;background:var(--surface2);transition:border-color .15s,transform .15s}
.finance-day:not(.finance-blank):hover{border-color:var(--accent);transform:translateY(-1px)}
.finance-day.finance-blank{visibility:hidden;pointer-events:none}
.finance-day.profit{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:color-mix(in srgb,var(--accent) 28%,var(--line))}
.finance-day.loss{background:color-mix(in srgb,var(--red) 10%,var(--surface));border-color:color-mix(in srgb,var(--red) 24%,var(--line))}
.finance-day.flat{background:color-mix(in srgb,var(--orange) 11%,var(--surface))}
.finance-day.chosen{outline:2px solid var(--accent);outline-offset:1px;z-index:1}
.finance-day.current .finance-day-num{background:var(--accent);color:var(--accentInk)}
.finance-day-num{font-weight:800;display:inline-grid;place-items:center;border-radius:7px;width:25px;height:25px;font-size:12px}
.finance-day-net{font-variant-numeric:tabular-nums;font-weight:850;font-size:clamp(10px,1vw,13px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.finance-day-net.positive{color:var(--accent)}.finance-day-net.negative{color:var(--red)}
.finance-day-micro{display:flex;flex-wrap:wrap;align-items:center;gap:3px 7px;font-size:10px;color:var(--muted)}.finance-day-micro span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.finance-day-numwrap{display:flex;justify-content:space-between;align-items:center;gap:3px}

 v.tasks=(Array.isArray(obj.tasks)?obj.tasks:[]).filter(t=>t&&t.title).map(t=>({id:String(t.id||id()),title:String(t.title),desc:String(t.desc||''),type:['daily','weekly','monthly'].includes(t.type)?t.type:'daily',start:/^\d{4}-\d{2}-\d{2}$/.test(t.start)?t.start:today(),emoji:t.emoji||'✦',color:t.color||COLORS[0],archivedAt:t.archivedAt||null}));

 return v;}
function normalize(obj){if(!obj||typeof obj!=='object')throw Error('Некорректный файл');const s=Array.isArray(obj.transactions)?Object.assign(fresh(),obj):legacyToV2(obj);

function taskPeriod(t,s){return t.type==='weekly'?monday(s):t.type==='monthly'?monthOf(s):s}
function taskStartPeriod(t){return taskPeriod(t,t.start)}
function eligible(t,s){if(t.start>s&&taskStartPeriod(t)>taskPeriod(t,s))return false;if(t.archivedAt&&s>=t.archivedAt)return false;return true}

function dailyStatus(s){const l=dailyOn(s),done=l.filter(t=>periodDone(t,s)).length;return {done,total:l.length,p:pct(done,l.length)}}
function prevPeriod(t,s){if(t.type==='daily')return shift(s,-1);if(t.type==='weekly')return shift(monday(s),-7);const d=at(s);d.setDate(1);d.setMonth(d.getMonth()-1);return iso(d)}
function taskStreak(t){let s=today();if(!periodDone(t,s))s=prevPeriod(t,s);let count=0;for(let i=0;i<3000&&eligible(t,s)&&taskPeriod(t,s)>=taskStartPeriod(t)&&periodDone(t,s);i++){count++;s=prevPeriod(t,s)}return count}
function overallStreak(){let s=today();let st=dailyStatus(s);if(!st.total||st.done!==st.total)s=shift(s,-1);let count=0;for(let i=0;i<3000;i++){st=dailyStatus(s);if(!st.total||st.done!==st.total)break;count++;s=shift(s,-1)}return count}

function txMonth(y,m){const k=y+'-'+p2(m+1);return S.transactions.filter(t=>monthOf(t.date)===k)}
function monthFinance(y,m){const ls=txMonth(y,m);const inc=ls.filter(x=>x.type==='income').reduce((a,x)=>a+safeNumber(x.amount),0);const exp=ls.filter(x=>x.type==='expense').reduce((a,x)=>a+safeNumber(x.amount),0);return{inc,exp,net:inc-exp,items:ls}}

function monthData(y,m){const keys=monthKeys(y,m);let done=0,total=0,full=0,active=0,screens=[];for(const d of keys){if(d>today())continue;const x=dailyStatus(d);if(x.total){total+=x.total;done+=x.done;if(x.done===x.total)full++;active++}if(S.screen[d]!==undefined&&S.screen[d]!==null&&S.screen[d]!=='')screens.push(safeNumber(S.screen[d]))}return{done,total,p:pct(done,total),full,active,screenAverage:screens.length?Math.round(screens.reduce((a,b)=>a+b,0)/screens.length):null}}

function settingsPage(){return `${panelTop('Настройки','Управляй внешним видом, целями и резервными копиями. Все данные остаются в твоём браузере.')}
 <div class="settings-list"><section class="card settings-block"><div class="section-head"><h2>Персонализация</h2></div><div class="setting-row"><div class="setting-copy"><strong>Твоё имя</strong><p>Отображается на главной панели.</p></div><input class="field" id="setting-name" maxlength="36" value="${E(S.settings.name)}" placeholder="Как к тебе обращаться?"></div><div class="setting-row"><div class="setting-copy"><strong>Тема оформления</strong><p>13 тем для любого настроения.</p></div><select class="field" id="setting-theme" aria-label="Выбор цветовой темы">${THEMES.map(t=>`<option value="${t.id}" ${S.settings.theme===t.id?'selected':''}>${E(t.label)}</option>`).join('')}</select></div>${themePicker()}<div class="setting-row"><div class="setting-copy"><strong>Валюта</strong><p>Для записей о доходах и расходах.</p></div><select class="field" id="setting-currency">${['₽','$','€','₴','₸','₾','£'].map(x=>`<option value="${x}" ${S.settings.currency===x?'selected':''}>${x}</option>`).join('')}</select></div></section>
 <section class="card settings-block"><div class="section-head"><h2>Личные цели</h2></div><div class="setting-row"><div class="setting-copy"><strong>Лимит расходов за месяц</strong><p>Оповещение при превышении установленной суммы.</p></div><input class="field" type="number" id="setting-budget" min="0" step="0.01" value="${safeNumber(S.settings.monthlyBudget)}"></div><div class="setting-row"><div class="setting-copy"><strong>Цель экранного времени</strong><p>В минутах на день. Например, 180 = 3 часа.</p></div><input class="field" type="number" id="setting-screen" min="1" max="1440" step="1" value="${safeNumber(S.settings.screenGoal)}"></div><div style="margin-top:17px"><button class="btn" data-action="save-settings">${I('check')} Сохранить настройки</button></div></section>
 <section class="card settings-block"><div class="section-head"><h2>Резервное копирование</h2></div><div class="privacy-note">${I('shield')}<div><strong style="color:var(--ink)">Без аккаунта и сервера</strong><div style="margin-top:4px">Записи хранятся локально в браузере. Если удалить данные сайта или сменить устройство, записи могут исчезнуть. Регулярно скачивай резервную копию.</div></div></div><div class="setting-row"><div class="setting-copy"><strong>Полный архив в JSON</strong><p>Все привычки, история отметок, тренировки, планы, финансы и заметки.</p></div><button class="btn btn-outline" data-action="export-json">${I('download')} Скачать</button></div><div class="setting-row"><div class="setting-copy"><strong>Импортировать архив</strong><p>Поддерживаются резервные копии этой версии и JSON-данные старой «Серии».</p></div><button class="btn btn-outline" data-action="import-file">${I('upload')} Выбрать JSON</button></div><div class="setting-row"><div class="setting-copy"><strong>Вставить старые данные</strong><p>Если JSON из localStorage был скопирован вручную.</p></div><button class="btn btn-outline" data-action="paste-json">Вставить</button></div><div class="setting-row"><div class="setting-copy"><strong>CSV для Excel</strong><p>Единый CSV-отчёт можно открыть в Excel или другой таблице.</p></div><button class="btn btn-outline" data-action="export-csv">${I('download')} Экспорт</button></div></section><section class="card settings-block danger-zone"><div class="section-head"><h2>Очистка</h2></div><div class="setting-row"><div class="setting-copy"><strong>Удалить данные новой версии</strong><p>Операция необратима без резервной копии. Старый архив «seriya-v1» не затрагивается.</p></div><button class="btn btn-danger" data-action="reset">${I('trash')} Очистить</button></div></section><p class="sub">СЕРИЯ PRO · автономная версия · формат данных v2</p></div>`}
function morePage(){const links=NAV.filter(x=>['work','plans','analytics','settings'].includes(x[0]));return `${panelTop('Другие разделы','Дополнительные инструменты для личного прогресса.')}<div class="more-links">${links.map(x=>`<button class="more-link" data-go="${x[0]}">${I(x[2])}<span>${x[1]}</span>${I('chevronRight')}</button>`).join('')}</div>`}
function modal(title,body,options={}){modalState=options;$('modal').className='modal'+(options.wide?' wide':'');$('modal').innerHTML=`<div class="modal-top"><div><h2>${title}</h2>${options.subtitle?`<p>${options.subtitle}</p>`:''}</div><button class="modal-close" data-action="close-modal" aria-label="Закрыть">${I('close')}</button></div>${body}`;$('overlay').classList.add('show');document.body.style.overflow='hidden';const focus=$('modal').querySelector('input:not([type=hidden]),textarea,button');if(focus)setTimeout(()=>focus.focus({preventScroll:true}),40)}
function closeModal(){$('overlay').classList.remove('show');document.body.style.overflow='';modalState=null;$('modal').innerHTML=''}
function field(label,id,value='',type='text',extra=''){return `<label class="field-wrap"><span class="field-label">${label}</span><input class="field" id="${id}" type="${type}" value="${E(value)}" ${extra}></label>`}
function selectField(label,id,options,selected){return `<label class="field-wrap"><span class="field-label">${label}</span><select class="field" id="${id}">${options.map(o=>`<option value="${E(o[0])}" ${o[0]===selected?'selected':''}>${E(o[1])}</option>`).join('')}</select></label>`}
function modalActions(saveText='Сохранить',action='save-form'){return `<div class="modal-actions"><button class="btn btn-outline" data-action="close-modal">Отмена</button><button class="btn" data-action="${action}">${I('check')} ${saveText}</button></div>`}
function taskForm(task){modalState=null;const edit=!!task;const t=task||{title:'',desc:'',type:'daily',start:today(),emoji:'✦',color:COLORS[0]};const body=`<div class="form-grid"><div class="field-wrap wide">${field('Название привычки','f-title',t.title,'text','maxlength="100" placeholder="Например: Читать 20 минут" required')}</div><div class="field-wrap wide"><span class="field-label">Описание (необязательно)</span><textarea class="field" id="f-desc" maxlength="350" placeholder="Что именно планируешь делать?">${E(t.desc)}</textarea></div>${selectField('Периодичность','f-frequency',[['daily','Каждый день'],['weekly','Раз в неделю'],['monthly','Раз в месяц']],t.type)}${field('Начать с','f-date',t.start,'date','required')}${selectField('Значок','f-emoji',[['✦','✦ Цель'],['📚','📚 Чтение'],['💪','💪 Спорт'],['💧','💧 Вода'],['🧘','🧘 Медитация'],['🚶','🚶 Прогулка'],['💻','💻 Учёба'],['☀️','☀️ Утро'],['🌿','🌿 Здоровье'],['💰','💰 Финансы']],t.emoji||'✦')}${selectField('Цвет','f-color',[['#72e6bd','Мятный'],['#88adff','Синий'],['#ffcb8c','Янтарный'],['#baa6ff','Сиреневый'],['#ff8295','Коралловый']],t.color||COLORS[0])}</div>${edit?`<div class="hr"></div><div class="chip-row"><button class="btn btn-outline btn-sm" data-action="archive-task" data-id="${E(t.id)}">${I('inbox')} ${t.archivedAt?'Вернуть из архива':'В архив'}</button><button class="btn btn-danger btn-sm" data-action="delete-task" data-id="${E(t.id)}">${I('trash')} Удалить с историей</button></div>`:''}${modalActions(edit?'Сохранить изменения':'Создать привычку')}`;modal(edit?'Редактирование привычки':'Новая привычка',body,{kind:'task',id:task?.id});}
function transactionForm(tx,date){const t=tx||{type:'expense',amount:'',date:date||selected||today(),category:'Еда',note:''};const body=`<div class="form-grid">${selectField('Тип операции','f-txtype',[['expense','Расход'],['income','Доход']],t.type)}${field('Сумма','f-amount',t.amount,'number','min="0.01" step="0.01" inputmode="decimal" required')}${field('Дата','f-date',t.date,'date','required')}${selectField('Категория','f-cat',CATEGORIES[t.type].map(x=>[x,x]),t.category)}<div class="field-wrap wide">${field('Описание (необязательно)','f-note',t.note||'','text','maxlength="200" placeholder="На что потрачено или откуда получено?"')}</div></div>${tx?`<div class="hr"></div><button class="btn btn-danger btn-sm" data-action="delete-transaction" data-id="${E(t.id)}">${I('trash')} Удалить операцию</button>`:''}${modalActions(tx?'Сохранить':'Добавить операцию')}`;modal(tx?'Редактировать операцию':'Новая операция',body,{kind:'transaction',id:tx?.id});}
function workoutForm(item,date){const t=item||{name:'',date:date||today(),minutes:30,note:''};const body=`<div class="form-grid"><div class="field-wrap wide">${field('Что делал','f-title',t.name,'text','required maxlength="120" placeholder="Например: Бег, зал, плавание"')}</div>${field('Дата','f-date',t.date,'date','required')}${field('Длительность (мин)','f-minutes',t.minutes,'number','min="0" max="1440" step="1"') }<div class="field-wrap wide">${field('Заметка','f-note',t.note||'','text','maxlength="250" placeholder="Самочувствие, подходы, дистанция..."')}</div></div>${item?`<div class="hr"></div><button class="btn btn-danger btn-sm" data-action="delete-workout" data-id="${E(t.id)}">${I('trash')} Удалить тренировку</button>`:''}${modalActions(item?'Сохранить':'Добавить тренировку')}`;modal(item?'Редактировать тренировку':'Новая тренировка',body,{kind:'workout',id:item?.id});}
function planForm(item,date){const p=item||{text:'',date:date||today(),imp:false,done:false};const body=`<div class="form-grid"><div class="field-wrap wide">${field('Что планируешь','f-title',p.text,'text','required maxlength="200" placeholder="Например: Закончить проект"')}</div>${field('Срок выполнения','f-date',p.date,'date','required')}<label class="field-wrap"><span class="field-label">Приоритет</span><select class="field" id="f-important"><option value="0" ${!p.imp?'selected':''}>Обычный</option><option value="1" ${p.imp?'selected':''}>★ Важный</option></select></label></div>${item?`<div class="hr"></div><button class="btn btn-danger btn-sm" data-action="delete-plan" data-id="${E(p.id)}">${I('trash')} Удалить план</button>`:''}${modalActions(item?'Сохранить':'Создать план')}`;modal(item?'Редактировать план':'Новый план',body,{kind:'plan',id:item?.id});}
function screenForm(date){const v=S.screen[date];const body=`<div class="form-grid">${field('Дата','f-date',date,'date','required')}${field('Минут за день','f-minutes',v===undefined?'':v,'number','min="0" max="1440" step="1" placeholder="Например, 135"')}<div class="field-wrap wide"><div class="small-note">Время можно посмотреть в настройках телефона: «Экранное время» на iPhone или «Цифровое благополучие» на Android.</div></div></div>${modalActions('Сохранить','save-screen')}`;modal('Экранное время',body,{kind:'screen',date})}
function diaryDay(date,tab='tasks'){selected=date;const tabs=[['tasks','Привычки'],['money','Финансы'],['work','Спорт'],['plans','Планы'],['notes','Заметки']];const common=`<div class="modal-tabs">${tabs.map(x=>`<button data-day-tab="${x[0]}" data-date="${date}" class="${tab===x[0]?'active':''}">${x[1]}</button>`).join('')}</div>`;let content='';if(tab==='tasks'){const ts=tasksOn(date);content=ts.length?ts.map(t=>taskLine(t,date)).join(''):empty('Задач на дату нет','Создай новую регулярную привычку.','add-task','Новая привычка','tasks');content+=`<button class="btn btn-outline btn-sm vertical-gap" data-action="add-task">${I('plus')} Создать привычку</button>`}else if(tab==='money'){const ls=txOn(date);content=ls.length?ls.map(t=>txRow(t)).join(''):empty('Нет операций','Добавь поступления или расходы.','','','wallet');content+=`<button class="btn btn-outline btn-sm vertical-gap" data-action="add-transaction" data-date="${date}">${I('plus')} Операция</button>`}else if(tab==='work'){const list=workoutsOn(date);content=list.length?list.map(w=>`<div class="info-row"><div><strong>${E(w.name)}</strong><small>${duration(w.minutes)} ${w.note?'· '+E(w.note):''}</small></div><button class="mini-icon" data-action="edit-workout" data-id="${E(w.id)}">${I('edit')}</button></div>`).join(''):empty('Нет тренировок','Можно записать тренировку за этот день.','','','activity');content+=`<button class="btn btn-outline btn-sm vertical-gap" data-action="add-workout" data-date="${date}">${I('plus')} Тренировка</button>`}else if(tab==='plans'){const list=plansOn(date);content=list.length?list.map(x=>planRow(x)).join(''):empty('Нет планов','Планируй дела на конкретный день.','','','flag');content+=`<button class="btn btn-outline btn-sm vertical-gap" data-action="add-plan" data-date="${date}">${I('plus')} План</button>`}else{content=`<div class="form-grid"><div class="field-wrap wide"><span class="field-label">Записи и мысли</span><textarea class="field" id="day-note" maxlength="5000" rows="6" placeholder="Как прошёл день? Что получилось?">${E(S.notes[date]||'')}</textarea></div></div><button class="btn btn-sm" data-action="save-note" data-date="${date}">${I('check')} Сохранить заметку</button><div class="hr"></div><strong style="font-size:14px">Экранное время</strong><div class="info-row"><div><small>${S.screen[date]!==undefined?duration(S.screen[date]):'Ещё не указано'}</small></div><button class="btn btn-outline btn-sm" data-action="screen" data-date="${date}">Изменить</button></div>`}
 modal(fullDate(date),common+content+'<div class="modal-actions"><button class="btn btn-outline" data-action="close-modal">Закрыть</button></div>',{kind:'day',date,tab,wide:true,subtitle:DAYS[at(date).getDay()]+' · дневник прогресса'})}
function quickForm(){modal('Быстрое добавление',`<div class="quick-grid"><button class="quick-btn" data-action="add-task">${I('tasks')} Привычка</button><button class="quick-btn" data-action="add-transaction">${I('wallet')} Доход / расход</button><button class="quick-btn" data-action="add-workout">${I('activity')} Тренировка</button><button class="quick-btn" data-action="add-plan">${I('flag')} План</button><button class="quick-btn" data-action="screen">${I('phone')} Экранное время</button><button class="quick-btn" data-action="open-day" data-date="${today()}">${I('calendar')} Дневник дня</button></div>`,{kind:'quick'})}
function saveForm(){if(!modalState)return;const type=modalState.kind,oldId=modalState.id,fieldVal=(s)=>$(s)?.value||'',date=fieldVal('f-date');if(type==='task'){const title=fieldVal('f-title').trim();if(!title){$('f-title').focus();return toast('Введи название привычки')}if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Выбери дату');const old=S.tasks.find(x=>x.id===oldId);const t={id:oldId||id(),title,desc:fieldVal('f-desc').trim(),type:fieldVal('f-frequency'),start:date,emoji:fieldVal('f-emoji'),color:fieldVal('f-color'),archivedAt:old?.archivedAt||null};if(old)Object.assign(old,t);else S.tasks.push(t)}
 else if(type==='transaction'){const amount=Number(fieldVal('f-amount'));if(!Number.isFinite(amount)||amount<=0)return toast('Сумма должна быть больше нуля');if(!date)return toast('Выбери дату');const t={id:oldId||id(),date,type:fieldVal('f-txtype'),amount:Math.round(amount*100)/100,category:fieldVal('f-cat')||'Другое',note:fieldVal('f-note').trim()};const old=S.transactions.find(x=>x.id===oldId);if(old)Object.assign(old,t);else S.transactions.push(t)}
 else if(type==='workout'){const name=fieldVal('f-title').trim(),minutes=Number(fieldVal('f-minutes'));if(!name)return toast('Напиши название тренировки');if(!date||!Number.isFinite(minutes)||minutes<0||minutes>1440)return toast('Проверь дату и длительность');const t={id:oldId||id(),name,date,minutes:Math.round(minutes),note:fieldVal('f-note').trim()};const old=S.workouts.find(x=>x.id===oldId);if(old)Object.assign(old,t);else S.workouts.push(t)}
 else if(type==='plan'){const text=fieldVal('f-title').trim();if(!text)return toast('Введи название плана');if(!date)return toast('Выбери дату');const old=S.plans.find(x=>x.id===oldId);const t={id:oldId||id(),date,text,imp:fieldVal('f-important')==='1',done:old?.done||false};if(old)Object.assign(old,t);else S.plans.push(t)}else return;
 persist();closeModal();render();toast(oldId?'Изменения сохранены':'Запись добавлена')}
function saveScreen(){const date=$('f-date').value,raw=$('f-minutes').value.trim();if(!date)return toast('Выбери дату');if(raw===''){delete S.screen[date]}else{const n=Number(raw);if(!Number.isInteger(n)||n<0||n>1440)return toast('Введи количество минут от 0 до 1440');S.screen[date]=n}persist();closeModal();render();toast('Экранное время сохранено')}
function download(name,type,content){const blob=new Blob([content],{type});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('Seriya_Pro_backup_'+today()+'.json','application/json;charset=utf-8',JSON.stringify({...S,version:2,exportedAt:new Date().toISOString()},null,2));toast('Резервная копия создана')}
function csvCell(s){let v=String(s??'');if(/^[=+@\-]/.test(v)&&isNaN(Number(v)))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['Раздел','Дата','Название','Сумма/минуты','Тип','Описание']];S.transactions.forEach(t=>rows.push(['Финансы',t.date,t.category,t.amount,t.type,t.note]));S.workouts.forEach(w=>rows.push(['Тренировки',w.date,w.name,w.minutes,'минуты',w.note]));S.plans.forEach(p=>rows.push(['Планы',p.date,p.text,'',p.done?'выполнено':'не выполнено',p.imp?'важный':'']));Object.entries(S.screen).forEach(([d,m])=>rows.push(['Экранное время',d,'Экран',m,'минуты','']));for(const t of S.tasks)for(const [key,flag] of Object.entries(S.done))if(flag&&key.startsWith(t.id+'|'))rows.push(['Привычки',key.slice(t.id.length+1),t.title,1,t.type,t.desc]);download('Seriya_Pro_report_'+today()+'.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'));toast('Отчёт CSV создан')}
function importJSON(raw){let data;try{data=JSON.parse(raw);if(typeof data==='string')data=JSON.parse(data);data=normalize(data)}catch(e){toast('Не удалось прочитать JSON. Проверь файл или текст.');return}if(!confirm('Заменить ВСЕ текущие записи данными из резервной копии? Перед импортом рекомендуется скачать архив.'))return;S=data;persist();closeModal();render();toast('Данные успешно импортированы')}
function handleClick(e){if(e.target===$('overlay')){closeModal();return}const el=e.target.closest('[data-action],[data-go],[data-toggle-task],[data-toggle-plan],[data-select-date],[data-task-filter],[data-tx-filter],[data-day-tab],[data-finance-view]');if(!el)return;
 const go=el.dataset.go;if(go){changePage(go);return}
 if(el.dataset.financeView){financeView=el.dataset.financeView==='transactions'?'transactions':'calendar';render();return}
 if(el.dataset.selectDate){selected=el.dataset.selectDate;if(monthOf(selected)!==cursor.getFullYear()+'-'+p2(cursor.getMonth()+1)){cursor=at(selected)}render();return}
 if(el.dataset.taskFilter){taskFilter=el.dataset.taskFilter;render();return}
 if(el.dataset.txFilter){txFilter=el.dataset.txFilter;render();return}
 if(el.dataset.toggleTask){const t=S.tasks.find(x=>x.id===el.dataset.toggleTask);if(!t)return;const d=el.dataset.date||today(),key=t.id+'|'+taskPeriod(t,d);if(S.done[key])delete S.done[key];else S.done[key]=1;persist();if(modalState?.kind==='day')diaryDay(modalState.date,modalState.tab);render();return}
 if(el.dataset.togglePlan){const p=S.plans.find(x=>x.id===el.dataset.togglePlan);if(!p)return;p.done=!p.done;persist();if(modalState?.kind==='day')diaryDay(modalState.date,modalState.tab);render();toast(p.done?'План выполнен':'План снова активен');return}
 if(el.dataset.dayTab){diaryDay(el.dataset.date,el.dataset.dayTab);return}
 const action=el.dataset.action;
 switch(action){case 'theme':setTheme(themeIsLight(S.settings.theme)?knownTheme(S.settings.lastDarkTheme||'dark'):knownTheme(S.settings.lastLightTheme||'light'));break;
 case 'choose-theme':setTheme(el.dataset.themeId);break;
 case 'quick':quickForm();break;case 'close-modal':closeModal();break;
 case 'prev-month':cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1,12);if(page==='calendar'||page==='money')selected=iso(new Date(cursor.getFullYear(),cursor.getMonth(),1,12));render();break;
 case 'next-month':cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1,12);if(page==='calendar'||page==='money')selected=iso(new Date(cursor.getFullYear(),cursor.getMonth(),1,12));render();break;
 case 'go-today':cursor=new Date();selected=today();render();break;
 case 'open-day':diaryDay(el.dataset.date||today());break;
 case 'add-task':taskForm();break;case 'edit-task':taskForm(S.tasks.find(t=>t.id===el.dataset.id));break;
 case 'add-transaction':transactionForm(null,el.dataset.date|| (page==='calendar'?selected:today()));break;case 'edit-transaction':transactionForm(S.transactions.find(t=>t.id===el.dataset.id));break;
 case 'add-workout':workoutForm(null,el.dataset.date);break;case 'edit-workout':workoutForm(S.workouts.find(t=>t.id===el.dataset.id));break;
 case 'add-plan':planForm(null,el.dataset.date);break;case 'edit-plan':planForm(S.plans.find(t=>t.id===el.dataset.id));break;
 case 'screen':screenForm(el.dataset.date|| (page==='calendar'?selected:today()));break;
 case 'save-form':saveForm();break;case 'save-screen':saveScreen();break;
 case 'save-note':{const date=el.dataset.date,v=$('day-note').value.trim();if(v)S.notes[date]=v;else delete S.notes[date];persist();toast('Заметка сохранена');break}
 case 'archive-task':{const t=S.tasks.find(x=>x.id===el.dataset.id);if(t){t.archivedAt=t.archivedAt?null:today();persist();closeModal();render();toast(t.archivedAt?'Привычка в архиве':'Привычка восстановлена')}break}
 case 'delete-task':{const t=S.tasks.find(x=>x.id===el.dataset.id);if(t&&confirm(`Удалить привычку «${t.title}» и ВСЕ её отметки?`)){S.tasks=S.tasks.filter(x=>x.id!==t.id);for(const k of Object.keys(S.done))if(k.startsWith(t.id+'|'))delete S.done[k];persist();closeModal();render();toast('Привычка удалена')}break}
 case 'delete-transaction':{if(confirm('Удалить эту операцию?')){S.transactions=S.transactions.filter(x=>x.id!==el.dataset.id);persist();closeModal();render();toast('Операция удалена')}break}
 case 'delete-workout':{if(confirm('Удалить тренировку?')){S.workouts=S.workouts.filter(x=>x.id!==el.dataset.id);persist();closeModal();render();toast('Тренировка удалена')}break}
 case 'delete-plan':{if(confirm('Удалить план?')){S.plans=S.plans.filter(x=>x.id!==el.dataset.id);persist();closeModal();render();toast('План удалён')}break}
 case 'save-settings':{S.settings.name=$('setting-name').value.trim();S.settings.theme=knownTheme($('setting-theme').value);S.settings.currency=$('setting-currency').value;S.settings.monthlyBudget=Math.max(0,safeNumber($('setting-budget').value));S.settings.screenGoal=Math.min(1440,Math.max(1,Math.round(safeNumber($('setting-screen').value))));persist();render();toast('Настройки сохранены');break}
 case 'export-json':exportJSON();break;case 'export-csv':exportCSV();break;case 'import-file':$('file-import').click();break;
 case 'paste-json':modal('Импорт JSON',`<div class="small-note">Вставь содержимое резервной копии. Поддерживается старый объект с полями tasks, done, money, work, plans, screen.</div><div class="field-wrap vertical-gap"><span class="field-label">Текст JSON</span><textarea class="field" id="paste-area" rows="8" placeholder='{ "tasks": [], "money": {} }'></textarea></div><div class="modal-actions"><button class="btn btn-outline" data-action="close-modal">Отмена</button><button class="btn" data-action="import-pasted">${I('upload')} Импортировать</button></div>`,{kind:'paste'});break;
 case 'import-pasted':importJSON($('paste-area').value);break;
 case 'reset':{if(!confirm('Ты уверен? ВСЕ записи текущей версии будут удалены.'))break;if(!confirm('Последнее подтверждение: очистить приложение без возможности восстановления?'))break;S=fresh();persist();closeModal();changePage('dashboard');toast('Данные новой версии очищены');break}
 default:break;
 }}
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{if(e.target?.id==='task-search'){const val=e.target.value,sel=e.target.selectionStart;taskSearch=val;const wrap=e.target.closest('.toolbar');const search=document.activeElement;const rows=S.tasks.filter(t=>(taskFilter==='all'||taskFilter==='active'&&!t.archivedAt||taskFilter==='archived'&&t.archivedAt)&&`${t.title} ${t.desc||''}`.toLowerCase().includes(val.toLowerCase()));const list=document.querySelector('#content > .stack');if(list)list.innerHTML=rows.length?rows.map(t=>`<article class="habit-card"><div class="habit-emoji" style="background:var(--accentSoft)">${E(t.emoji||'✦')}</div><div class="habit-main"><strong>${E(t.title)}</strong><p>${FREQ[t.type]||'Ежедневно'} · с ${relativeDay(t.start)}</p></div><div class="habit-side">${!t.archivedAt?`<button class="habit-check ${periodDone(t,today())?'done':''}" data-toggle-task="${E(t.id)}" data-date="${today()}">${I(periodDone(t,today())?'check':'plus')}</button>`:''}<button class="mini-icon" data-action="edit-task" data-id="${E(t.id)}">${I('edit')}</button></div></article>`).join(''):empty('Не найдено','Попробуй изменить поиск.','','','search');if(search&&search.id==='task-search'){search.focus();try{search.setSelectionRange(sel,sel)}catch(_){}}}
 if(e.target?.id==='f-txtype'){const select=$('f-cat');if(select){select.innerHTML=CATEGORIES[e.target.value].map(x=>`<option value="${E(x)}">${E(x)}</option>`).join('')}}});
document.addEventListener('change',e=>{if(e.target?.id==='setting-theme')setTheme(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show'))closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&modalState&&['task','transaction','workout','plan'].includes(modalState.kind))saveForm()});
$('file-import').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=await file.text();importJSON(raw)}catch(_){toast('Не удалось прочитать файл')}e.target.value=''});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==page&&(NAV.some(x=>x[0]===h)||h==='more')){page=h;render()}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=normalize(JSON.parse(e.newValue));render();toast('Данные обновлены в другой вкладке')}catch(_){}}});
render();if(migration)setTimeout(()=>toast('Данные старой версии перенесены. Скачай резервную копию в настройках.'),450);
</script>
</body>
</html>
